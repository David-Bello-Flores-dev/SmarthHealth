name: Deploy Backend to Azure WebApp

on:
  pull_request: 
    branches: [ "main" ]
  workflow_dispatch:

env:
  AZURE_WEBAPP_NAME: 'backendApp'
  REGISTRY_LOGIN_SERVER: 'smbconta.azurecr.io' 
  IMAGE_NAME: 'backend-app' 

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Descargar el codigo del repositorio
      uses: actions/checkout@v4

    - name: Log in to ACR
      uses: azure/docker-login@v1
      with:
        login-server: smbconta.azurecr.io
        username: ${{ secrets.ACR_USERNAME_BACK }}
        password: ${{ secrets.ACR_PASSWORD_BACK }}
          
    - name: Build and Push Docker Image
      run: |
          docker build -t smbconta.azurecr.io/backend-app:${{ github.sha }} ./server
          docker push smbconta.azurecr.io/backend-app:${{ github.sha }}
          
    - name: Desplegar en Azure WebApp
      uses: azure/webapps-deploy@v3
      with:
        app-name: ${{ env.AZURE_WEBAPP_NAME }}
        publish-profile: ${{ secrets.AZURE_DEPLOYMENT }}
        images: '${{ env.REGISTRY_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:${{ github.sha }}'
